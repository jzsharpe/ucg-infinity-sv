<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UCG WAG Open SV Sheets</title>
    <meta name="description" content="Plan WAG Open Scoring routines, calculate start values, and export UCG SV worksheets." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤸</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">UCG</span>
        <span>WAG Open SV Sheets</span>
      </div>
      <div id="user-area" class="user-area"></div>
    </header>

    <div id="local-banner" class="banner" hidden>
      Local mode: athletes are saved in this browser only. Add your Firebase config to turn on Google sign-in and cloud saving.
    </div>

    <main id="app">
      <p class="loading">Loading…</p>
    </main>

    <template id="signin-tpl">
      <section class="signin">
        <h1>Plan routines. Know your start value.</h1>
        <p>Add your athletes, enter their skills for each event, and export a filled-in UCG WAG Open Start Value Worksheet.</p>
        <button id="signin-btn" class="btn btn-google" type="button">
          <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2c-2 1.5-4.5 2.4-7.2 2.4-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
          Sign in with Google
        </button>
        <p id="signin-error" class="error" hidden></p>
      </section>
    </template>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
